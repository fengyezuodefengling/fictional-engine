// 螺纹连接原22题
["螺纹按（ ）的大小，可分为细牙螺纹和粗牙螺纹。",["A. 公称直径","B. 螺距","C. 中径","D. 小径"],"B","粗牙、细牙按螺距区分。","螺纹连接"],
["联接螺纹常采用（ ）。",["A. 三角螺纹","B. 矩形螺纹","C. 梯形螺纹","D. 锯齿形螺纹"],"A","三角螺纹常用于螺纹连接。","螺纹连接"],
["普通螺纹的公称直径是（ ）径。",["A. 大","B. 小","C. 中"],"A","普通螺纹的公称直径就是大径。","螺纹连接"],
["当螺纹公称直径、牙型角、螺纹线数相同时，细牙螺纹的自锁性能（ ）。",["A. 好","B. 差","C. 相同"],"A","细牙螺距小，导程小，升角小，更容易满足自锁条件。","螺纹连接"],
["用于薄壁零件的连接螺纹，应采用（ ）。",["A. 三角形粗牙螺纹","B. 三角形细牙螺纹","C. 锯齿形螺纹","D. 梯形螺纹"],"B","薄壁零件通常采用细牙螺纹。","螺纹连接"],
["单线螺纹的大径 d=10 mm，中径 d₂=9.026 mm，小径 d₁=8.376 mm，螺距 P=1.5 mm，则螺纹的升角 λ 为（ ）。",["A. 2.734°","B. 3.028°","C. 3.263°","D. 6.039°"],"B","单线螺纹导程 Ph=P；tanλ=Ph/(πd₂)，得 λ≈3.028°。","螺纹连接"],
["螺纹主要参数间的关系是（ ）。",["A. 导程 Ph=nP，螺纹升角 λ=arctan(Ph/(πd₂))","B. 导程 Ph=nP，螺纹升角 λ=arctan(πd₂/Ph)","C. 螺距 P=nPh，螺纹升角 λ=arctan(Ph/(πd₂))","D. 螺距 P=nPh，螺纹升角 λ=arctan(πd₂/Ph)"],"A","导程 Ph=nP；tanλ=Ph/(πd₂)。","螺纹连接"],
["螺纹的牙型角为 α，螺纹中的摩擦角为 ρ，当量摩擦角为 ρᵥ，螺纹升角为 λ，则螺纹的自锁条件为（ ）。",["A. λ≤α","B. λ>α","C. λ≤ρᵥ","D. λ>ρᵥ"],"C","自锁条件：λ≤ρᵥ。","螺纹连接"],
["采用螺钉联接时，若被联接件的厚度较大，且材料较软、强度较低，但不需要经常拆卸的情况下，一般宜采用（ ）。",["A. 螺栓联接","B. 螺钉联接","C. 螺柱联接","D. 紧定螺钉联接"],"B","厚、软且不需经常拆卸时宜用螺钉连接。","螺纹连接"],
["当两个被连接件不太厚时，宜采用（ ）。",["A. 双头螺柱连接","B. 螺栓连接","C. 螺钉连接","D. 紧定螺钉连接"],"B","被连接件不太厚时通常采用普通螺栓连接。","螺纹连接"],
["螺纹联接防松的根本问题在于（ ）。",["A. 增加螺纹联接的轴向力","B. 增加螺纹联接的刚度","C. 防止螺纹副的相对转动","D. 防止螺栓被折断"],"C","防松的根本是防止螺纹副发生相对转动。","螺纹连接"],
["螺栓联接防松的根本在于防止（ ）的相对转动。",["A. 螺栓和螺母","B. 螺栓和被联接件","C. 螺母和被联接件","D. 被联接件和被联接件"],"A","主要防止螺栓与螺母发生相对转动。","螺纹连接"],
["下面螺纹连接的防松措施中，属于摩擦防松的是（ ）。",["A. 用串联钢丝将一组螺钉头部串联起来","B. 用双螺母","C. 用止动垫片","D. 用开口销和槽形螺母"],"B","双螺母通过增加摩擦阻力实现防松。","螺纹连接"],
["被连接件受横向外力作用时，如果采用普通螺栓连接，则螺栓可能的失效形式为（ ）。",["A. 剪切或挤压破坏","B. 拉断","C. 拉、扭联合作用下断裂","D. 拉、扭联合作用下塑性变形"],"A","横向载荷下，普通螺栓可能发生剪切或挤压破坏。","螺纹连接"],
["螺栓的性能等级为 6.8，则螺栓材料的屈服强度为（ ）MPa。",["A. 480","B. 600","C. 240","D. 360"],"A","6.8表示抗拉强度600 MPa，屈服强度为0.8×600=480 MPa。","螺纹连接"],
["受轴向载荷的紧螺栓联接，为保证被联接件不出现缝隙，因此（ ）。",["A. 剩余预紧力 F′ 应小于零","B. 剩余预紧力 F′ 应大于零","C. 剩余预紧力 F′ 应等于零","D. 预紧力 F′ 应大于零"],"B","为保证不出现缝隙，剩余预紧力必须保持 F′>0。","螺纹连接"],
["对于紧螺栓连接，当螺栓的总拉力 F₀ 和剩余预紧力 F′ 不变时，若将螺栓由实心变空心，则螺栓的应力幅 σₐ 与预紧力 F′ 会变化（ ）。",["A. σₐ 增大，F′ 应适当减小","B. σₐ 增大，F′ 应适当增大","C. σₐ 减小，F′ 应适当减小","D. σₐ 减小，F′ 应适当增大"],"?","这道原题题干与选项存在表述矛盾，旧题库暂保留“需核对原题”，不要强行判分。","螺纹连接"],
["一螺纹联接的力—变形图如图所示，若保证剩余预紧力 F₁ 等于预紧力 F₀ 的一半，则该螺纹联接能承受的最大轴向工作载荷 Fₘₐₓ 的大小为（ ）。",["A. F₀","B. 1/2 F₀","C. 3/2 F₀","D. √2/2 F₀"],"A","结合力—变形图的几何关系，可得 Fmax=F₀。","螺纹连接"],
["预紧力为 Qₚ 的单个紧螺栓连接，受到轴向工作载荷 F 之后，螺栓杆受到的总载荷 Q（ ）。",["A. 大于 Qₚ+F","B. 等于 Qₚ+F","C. 小于 Qₚ+F"],"C","Q=Qₚ+CF，且0<C<1，因此Q<Qₚ+F。","螺纹连接"],
["在以下措施中，（ ）有利于改善螺栓螺纹牙之间载荷分布不均匀的现象。",["A. 加弹簧垫圈","B. 减小螺杆直径","C. 增大螺母高度","D. 采用悬置螺母"],"D","悬置螺母通过改变螺母受力变形规律，使各圈螺纹牙载荷分配更均匀。","螺纹连接"],
["螺栓联接中，旋合螺纹牙间载荷分布不均匀是由于（ ）。",["A. 螺母太厚","B. 螺母和螺栓变形大小不同","C. 应力集中","D. 螺母与螺栓变形性质不同"],"D","本质是螺栓、螺母受力后的变形性质不同，导致各圈螺纹牙变形不一致。","螺纹连接"],
["对于受轴向变载荷的紧螺栓连接，在限定螺栓总拉力的情况下，提高螺栓疲劳强度的有效措施是（ ）。",["A. 增大被连接件的刚度","B. 减小被连接件的刚度","C. 增大螺栓的刚度","D. 减小螺栓的长度"],"A","增大被连接件刚度，可降低外载荷分配给螺栓的比例，从而减小螺栓应力幅。","螺纹连接"],

["普通平键的工作面是（ ），楔键连接的工作面是（ ）。",["A. 平键两侧面，楔键上、下面","B. 平键上面，楔键两侧面","C. 两者均为两侧面","D. 两者均为上、下面"],"A","普通平键靠键的两侧面传递转矩；楔键靠上、下两个工作面之间的楔紧作用传递转矩。","键连接"],
["一般采用（ ）加工B型普通平键的键槽。",["A. 键槽铣刀","B. 盘状铣刀","C. 插刀","D. 车刀"],"B","B型普通平键键槽为通槽，通常用盘状（三面刃）铣刀加工。","键连接"],
["键连接的主要缺点是（ ）。",["A. 键槽对轴的削弱较小","B. 工艺性好、键槽加工方便","C. 键受挤时容易损坏","D. 轴和轮毂上的零件对中性差"],"D","键槽会削弱轴的截面，并可能产生应力集中，使轴与轮毂的同轴性受到影响；这是键连接的典型缺点。","键连接"],
["（ ）的键槽对轴强度的削弱最大。",["A. 平键","B. 半圆键","C. 楔键","D. 花键"],"B","半圆键的轴上键槽较深，因此对轴的削弱较大。","键连接"],

["切向键联接的斜度是做在（ ）上的。",["A. 轮毂键槽底面","B. 轴的键槽底面","C. 一对键的接触面","D. 键的侧面"],"C","切向键由一对斜楔键组成，斜度做在两键彼此接触的工作面上。","键连接"],
["能构成紧密连接的两种键是（ ）。",["A. 楔键和半圆键","B. 半圆键和切向键","C. 楔键和切向键","D. 平键和半圆键"],"C","楔键和切向键都利用楔紧作用形成紧密连接；平键、半圆键主要靠侧面挤压传递转矩。","键连接"],
["键8×7×12（GB/T 1096—2003），该标记中键高是（ ）。",["A. 12","B. 8","C. 7","D. 10"],"C","普通平键标记按 b×h×L 表示，因此8×7×12中：宽b=8，高h=7，长度L=12。","键连接"],
["大型带轮、大型飞轮、矿山用大型绞车的卷筒及齿轮等与轴的连接常用（ ）。",["A. 半圆键","B. 花键","C. 楔键","D. 切向键"],"D","切向键承载能力较大，常用于大型、重载轴毂连接，如大型带轮、飞轮和矿山绞车卷筒等。","键连接"],
["如需在轴上安装一对半圆键，则应将它们布置在（ ）。",["A. 相隔90°","B. 相隔120°位置","C. 轴的同一母线上","D. 相隔180°"],"C","两个半圆键应布置在轴的同一母线上，以减小对轴强度的不利影响。","键连接"],
["设计键联接的主要程序是：a.按轮毂长度选择键的长度；b.按轴的直径选择键的剖面尺寸；c.按使用要求选择键的类型；d.进行必要的强度校核。正确顺序为（ ）。",["A. a→b→c→d","B. b→a→c→d","C. c→b→a→d","D. a→c→b→d"],"C","先根据使用要求确定键的类型，再按轴径确定截面尺寸，再按轮毂长度确定键长，最后进行强度校核。","键连接"],
["标准平键的承载能力取决于（ ）。",["A. 键的剪切强度","B. 键的弯曲强度","C. 键联接工作表面的挤压强度","D. 轮毂的挤压强度"],"C","普通平键连接通常以工作面的挤压强度为主要校核依据，因为按标准尺寸选用时，压溃通常是主要失效形式。","键连接"],
["对于采用常见的组合和按标准选取尺寸的平键静连接，主要失效形式是（ ），动连接的主要失效形式则是（ ）。",["A. 工作面的压溃＋工作面过度磨损","B. 工作面过度磨损＋工作面的压溃","C. 键被剪断＋键被弯断","D. 键被弯断＋键被剪断"],"A","静连接主要考虑工作面压溃；导向平键、滑键等动连接存在相对滑动，主要失效形式是工作面过度磨损。","键连接"],
["从经济性和生产周期性考虑，单件生产的箱体最好采用（ ）。", ["A. 铸铁件", "B. 铸钢件", "C. 焊接件", "D. 塑料件"], "C", "单件、小批量生产时，焊接结构可减少专用铸造模具和准备时间，制造周期短。", "绪论和机械设计总论"],
["机器和机构的主要区别是（ ）。", ["A. 人为的实物组合", "B. 各部分具有确定的相对运动", "C. 转换能量或完成有用功", "D. 运动传递与变换"], "C", "机构的主要功能是传递和变换运动；机器除具有机构的运动功能外，还能转换能量或完成有用功。", "绪论和机械设计总论"],
["机械零件由于某些原因不能（ ）时称为失效。", ["A. 工作", "B. 连续工作", "C. 正常工作", "D. 负载工作"], "C", "零件不能正常工作，即不能满足预定功能和工作要求时，称为失效。", "绪论和机械设计总论"],
["在机械零件的强度条件式中，常用到“计算载荷”，而“计算载荷”一般（ ）。", ["A. 小于名义载荷", "B. 大于静载荷而小于动载荷", "C. 接近于额定载荷", "D. 大于名义载荷而接近于实际载荷"], "D", "计算载荷是在名义载荷基础上考虑载荷系数等影响后得到的，通常大于名义载荷，并尽量反映实际工作中的不利情况。", "绪论和机械设计总论"],

let mode='all', chapter='all', i=0,score=0,answered=false,selected='',round=[],wrong=JSON.parse(localStorage.getItem('jx_wrong')||'[]'),fav=JSON.parse(localStorage.getItem('jx_fav')||'[]'),weak=JSON.parse(localStorage.getItem('jx_weak')||'[]');
const app=document.getElementById('app');
function chapters(){return [...new Set(qs.map(q=>q[4]))]}
function filtered(){let a=qs.map((q,n)=>({q,n})).filter(x=>chapter==='all'||x.q[4]===chapter);if(mode==='wrong')a=a.filter(x=>wrong.includes(x.n));if(mode==='fav')a=a.filter(x=>fav.includes(x.n));if(mode==='weak')a=a.filter(x=>weak.includes(x.n));return a}
function start(){round=filtered();if(mode==='random')round.sort(()=>Math.random()-.5);i=0;score=0;selected='';answered=false;render()}
function render(){
 const a=filtered();
 if(!round.length|| (i>=round.length)){app.innerHTML=`<div class="title">机械设计刷题小程序</div><div class="sub">当前题库 ${qs.length} 题：按章节持续扩充，含螺纹、键、摩擦润滑、机械零件强度、绪论等章节</div><div class="stats"><div class="stat"><b>${qs.length}</b>总题数</div><div class="stat"><b>${wrong.length}</b>错题</div><div class="stat"><b>${weak.length}</b>似会非会</div><div class="stat"><b>${fav.length}</b>收藏</div></div><div class="empty">${a.length?'本轮已完成':'当前筛选下暂无题目'}<br><button class="btn2" style="margin-top:14px" onclick="resetAll()">开始刷题</button></div>`;return}
 const n=round[i].n,q=qs[n];
 const vcount=(variants[n]||[]).length;
 app.innerHTML=`<div class="title">机械设计刷题小程序</div><div class="sub">持续题库版｜本次新增：绪论、摩擦/磨损/润滑、机械零件强度等章节</div>
 <div class="toolbar"><button class="btn2 ${mode==='all'?'active':''}" onclick="setMode('all')">全部</button><button class="btn2 ${mode==='random'?'active':''}" onclick="setMode('random')">随机</button><button class="btn2 ${mode==='wrong'?'active':''}" onclick="setMode('wrong')">错题本</button><button class="btn2 ${mode==='fav'?'active':''}" onclick="setMode('fav')">收藏</button><button class="btn2 ${mode==='weak'?'active':''}" onclick="setMode('weak')">似会非会</button><button class="btn2 ${mode==='variant'?'active':''}" onclick="openVariants()">举一反三</button><select class="select" onchange="setChapter(this.value)"><option value="all">全部章节</option>${chapters().map(c=>`<option value="${c}" ${chapter===c?'selected':''}>${c}</option>`).join('')}</select></div>
 <div class="stats"><div class="stat"><b>${i+1}/${round.length}</b>本轮进度</div><div class="stat"><b>${score}</b>答对</div><div class="stat"><b>${wrong.length}</b>错题</div><div class="stat"><b>${weak.length}</b>似会非会</div><div class="stat"><b>${fav.length}</b>收藏</div></div>
 <div class="card"><span class="tag">${q[4]}</span>${vcount?`<button class="btn2" style="float:right" onclick="openVariants()">举一反三 · ${vcount}题</button>`:''}<div style="clear:both"></div><div class="q">${q[0]}</div>${q[1].map(x=>`<button class="opt ${answered?(x[0]===q[2]?'ok':(x[0]===selected?'no':'')):(x[0]===selected?'sel':'')}" onclick="choose('${x[0]}')" ${answered?'disabled':''}>${x}</button>`).join('')}
 ${answered?`<div class="answer"><b>答案：${q[2]==='?'?'需核对原题':q[2]}</b><div class="reason">解析：${q[3]}</div>${q[2]!=='?'&&selected!==q[2]?'<div class="mistake">已加入错题本。</div>':''}${q[2]!=='?'&&selected===q[2]&&vcount?'<div style="margin-top:10px"><button class="btn2" onclick="openVariants()">立即进入举一反三 →</button></div>':''}</div>`:''}
 <div class="actions"><button class="mainbtn" onclick="next()" ${answered?'':'disabled'}>${i===round.length-1?'完成本轮':'下一题'}</button><button class="fav" onclick="toggleFav()">${fav.includes(n)?'★':'☆'}</button></div></div><div class="tip">母题答完后可自由选择“下一题”继续刷题，也可以点击“举一反三”进行同考点变式训练；变式做不好会进入“似会非会”。</div>`;
}
function choose(v){if(answered)return;selected=v;answered=true;const n=round[i].n;if(qs[n][2]!=='?'&&v===qs[n][2]){score++;wrong=wrong.filter(x=>x!==n)}else if(qs[n][2]!=='?'&&!wrong.includes(n))wrong.push(n);localStorage.setItem('jx_wrong',JSON.stringify(wrong));render()}
function next(){if(!answered)return;i++;selected='';answered=false;render()}
function toggleFav(){const n=round[i].n;if(fav.includes(n))fav=fav.filter(x=>x!==n);else fav.push(n);localStorage.setItem('jx_fav',JSON.stringify(fav));render()}
function setMode(m){mode=m;start()}
function setChapter(c){chapter=c;start()}

function openVariants(){
 const n=round[i]?.n;
 const vs=variants[n]||[];
 if(!vs.length){alert('这道母题暂时还没有录入变式。以后新增题目时可以继续给它挂变式。');return;}
 let vi=0,vscore=0,vans=false,vsel='';
 function finishVariants(){
   const weakNow=vscore<Math.ceil(vs.length*0.67);
   if(weakNow){if(!weak.includes(n))weak.push(n)}else{weak=weak.filter(x=>x!==n)}
   localStorage.setItem('jx_weak',JSON.stringify(weak));
   const msg=weakNow?'这个知识点暂时判定为「似会非会」：母题会做，但变式迁移还不稳定。':'这个知识点已基本掌握：母题＋变式迁移通过。';
   app.innerHTML=`<div class="title">举一反三完成</div><div class="sub">母题：${n+1}｜本组 ${vs.length} 道变式</div>
   <div class="result"><div class="score">${vscore}/${vs.length}</div><h2>${weakNow?'似会非会':'基本掌握'}</h2><p>${msg}</p><button class="mainbtn" onclick="render()">返回母题</button><button class="btn2" style="margin-top:10px" onclick="setMode('weak')">去刷“似会非会”</button></div>`;
 }
 function vrender(){
  const v=vs[vi];
  app.innerHTML=`<div class="title">举一反三</div><div class="sub">母题：${n+1}｜本组 ${vi+1}/${vs.length}｜同一考点换角度</div>
  <div class="stats"><div class="stat"><b>${vscore}</b>本组答对</div><div class="stat"><b>${vs.length}</b>变式总数</div><div class="stat"><b>${n+1}</b>母题题号</div><div class="stat"><b>迁移训练</b>模式</div></div>
  <div class="card"><span class="tag">${qs[n][4]} · 变式${vi+1}</span><div class="q">${v[0]}</div>${v[1].map(x=>`<button class="opt ${vans?(x[0]===v[2]?'ok':(x[0]===vsel?'no':'')):(x[0]===vsel?'sel':'')}" onclick="window.__vchoose('${x[0]}')" ${vans?'disabled':''}>${x}</button>`).join('')}
  ${vans?`<div class="answer"><b>答案：${v[2]}</b><div class="reason">解析：${v[3]}</div>${vsel!==v[2]?'<div class="mistake">这道变式答错了——重点不是记住答案，而是找出与母题相同的知识本质。</div>':''}</div>`:''}
  <div class="actions"><button class="mainbtn" onclick="window.__vnext()" ${vans?'':'disabled'}>${vi===vs.length-1?'查看掌握情况':'下一道变式'}</button></div></div>
  <div class="tip">变式会改变问法、选项或应用场景，专门检查你是否真正理解这个知识点。</div>`;
 }
 window.__vchoose=function(x){if(vans)return;vsel=x;vans=true;if(x===vs[vi][2])vscore++;vrender()};
 window.__vnext=function(){if(!vans)return;if(vi===vs.length-1){delete window.__vchoose;delete window.__vnext;finishVariants()}else{vi++;vans=false;vsel='';vrender()}};
 vrender();
}
function qLabel(n){return '第'+(n+1)+'题'}

function resetAll(){mode='all';chapter='all';start()}
function clearWeak(){weak=[];localStorage.setItem('jx_weak','[]');render()}
start();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>

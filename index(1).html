<script>
const qs=[
// 螺纹连接原22题
["螺纹按（ ）的大小，可分为细牙螺纹和粗牙螺纹。",["A. 公称直径","B. 螺距","C. 中径","D. 小径"],"B","粗牙、细牙按螺距区分。","螺纹连接"],
["联接螺纹常采用（ ）。",["A. 三角螺纹","B. 矩形螺纹","C. 梯形螺纹","D. 锯齿形螺纹"],"A","三角螺纹常用于螺纹连接。","螺纹连接"],
["普通螺纹的公称直径是（ ）径。",["A. 大","B. 小","C. 中"],"A","普通螺纹的公称直径就是大径。","螺纹连接"],
["当螺纹公称直径、牙型角、螺纹线数相同时，细牙螺纹的自锁性能（ ）。",["A. 好","B. 差","C. 相同"],"A","细牙螺距小，导程小，升角小，更容易满足自锁条件。","螺纹连接"],
["用于薄壁零件的连接螺纹，应采用（ ）。",["A. 三角形粗牙螺纹","B. 三角形细牙螺纹","C. 锯齿形螺纹","D. 梯形螺纹"],"B","薄壁零件通常采用细牙螺纹。","螺纹连接"],
["单线螺纹的大径 d=10 mm，中径 d₂=9.026 mm，小径 d₁=8.376 mm，螺距 P=1.5 mm，则螺纹的升角 λ 为（ ）。",["A. 2.734°","B. 3.028°","C. 3.263°","D. 6.039°"],"B","单线螺纹导程 Ph=P；tanλ=Ph/(πd₂)，得 λ≈3.028°。","螺纹连接"],
["螺纹主要参数间的关系是（ ）。",["A. 导程 Ph=nP，螺纹升角 λ=arctan(Ph/(πd₂))","B. 导程 Ph=nP，螺纹升角 λ=arctan(πd₂/Ph)","C. 螺距 P=nPh，螺纹升角 λ=arctan(Ph/(πd₂))","D. 螺距 P=nPh，螺纹升角 λ=arctan(πd₂/Ph)"],"A","导程 Ph=nP；tanλ=Ph/(πd₂)。","螺纹连接"],
["螺纹的牙型角为 α，螺纹中的摩擦角为 ρ，当量摩擦角为 ρᵥ，螺纹升角为 λ，则螺纹的自锁条件为（ ）。",["A. λ≤α","B. λ>α","C. λ≤ρᵥ","D. λ>ρᵥ"],"C","自锁条件：λ≤ρᵥ。","螺纹连接"],
["采用螺钉联接时，若被联接件的厚度较大，且材料较软、强度较低，但不需要经常拆卸的情况下，一般宜采用（ ）。",["A. 螺栓联接","B. 螺钉联接","C. 螺柱联接","D. 紧定螺钉联接"],"B","厚、软且不需经常拆卸时宜用螺钉连接。","螺纹连接"],
["当两个被连接件不太厚时，宜采用（ ）。",["A. 双头螺柱连接","B. 螺栓连接","C. 螺钉连接","D. 紧定螺钉连接"],"B","被连接件不太厚时通常采用普通螺栓连接。","螺纹连接"],
["螺纹联接防松的根本问题在于（ ）。",["A. 增加螺纹联接的轴向力","B. 增加螺纹联接的刚度","C. 防止螺纹副的相对转动","D. 防止螺栓被折断"],"C","防松的根本是防止螺纹副发生相对转动。","螺纹连接"],
["螺栓联接防松的根本在于防止（ ）的相对转动。",["A. 螺栓和螺母","B. 螺栓和被联接件","C. 螺母和被联接件","D. 被联接件和被联接件"],"A","主要防止螺栓与螺母发生相对转动。","螺纹连接"],
["下面螺纹连接的防松措施中，属于摩擦防松的是（ ）。",["A. 用串联钢丝将一组螺钉头部串联起来","B. 用双螺母","C. 用止动垫片","D. 用开口销和槽形螺母"],"B","双螺母通过增加摩擦阻力实现防松。","螺纹连接"],
["被连接件受横向外力作用时，如果采用普通螺栓连接，则螺栓可能的失效形式为（ ）。",["A. 剪切或挤压破坏","B. 拉断","C. 拉、扭联合作用下断裂","D. 拉、扭联合作用下塑性变形"],"A","横向载荷下，普通螺栓可能发生剪切或挤压破坏。","螺纹连接"],
["螺栓的性能等级为 6.8，则螺栓材料的屈服强度为（ ）MPa。",["A. 480","B. 600","C. 240","D. 360"],"A","6.8表示抗拉强度600 MPa，屈服强度为0.8×600=480 MPa。","螺纹连接"],
["受轴向载荷的紧螺栓联接，为保证被联接件不出现缝隙，因此（ ）。",["A. 剩余预紧力 F′ 应小于零","B. 剩余预紧力 F′ 应大于零","C. 剩余预紧力 F′ 应等于零","D. 预紧力 F′ 应大于零"],"B","为保证不出现缝隙，剩余预紧力必须保持 F′>0。","螺纹连接"],
["对于紧螺栓连接，当螺栓的总拉力 F₀ 和剩余预紧力 F′ 不变时，若将螺栓由实心变空心，则螺栓的应力幅 σₐ 与预紧力 F′ 会变化（ ）。",["A. σₐ 增大，F′ 应适当减小","B. σₐ 增大，F′ 应适当增大","C. σₐ 减小，F′ 应适当减小","D. σₐ 减小，F′ 应适当增大"],"?","这道原题题干与选项存在表述矛盾，旧题库暂保留“需核对原题”，不要强行判分。","螺纹连接"],
["一螺纹联接的力—变形图如图所示，若保证剩余预紧力 F₁ 等于预紧力 F₀ 的一半，则该螺纹联接能承受的最大轴向工作载荷 Fₘₐₓ 的大小为（ ）。",["A. F₀","B. 1/2 F₀","C. 3/2 F₀","D. √2/2 F₀"],"A","结合力—变形图的几何关系，可得 Fmax=F₀。","螺纹连接"],
["预紧力为 Qₚ 的单个紧螺栓连接，受到轴向工作载荷 F 之后，螺栓杆受到的总载荷 Q（ ）。",["A. 大于 Qₚ+F","B. 等于 Qₚ+F","C. 小于 Qₚ+F"],"C","Q=Qₚ+CF，且0<C<1，因此Q<Qₚ+F。","螺纹连接"],
["在以下措施中，（ ）有利于改善螺栓螺纹牙之间载荷分布不均匀的现象。",["A. 加弹簧垫圈","B. 减小螺杆直径","C. 增大螺母高度","D. 采用悬置螺母"],"D","悬置螺母通过改变螺母受力变形规律，使各圈螺纹牙载荷分配更均匀。","螺纹连接"],
["螺栓联接中，旋合螺纹牙间载荷分布不均匀是由于（ ）。",["A. 螺母太厚","B. 螺母和螺栓变形大小不同","C. 应力集中","D. 螺母与螺栓变形性质不同"],"D","本质是螺栓、螺母受力后的变形性质不同，导致各圈螺纹牙变形不一致。","螺纹连接"],
["对于受轴向变载荷的紧螺栓连接，在限定螺栓总拉力的情况下，提高螺栓疲劳强度的有效措施是（ ）。",["A. 增大被连接件的刚度","B. 减小被连接件的刚度","C. 增大螺栓的刚度","D. 减小螺栓的长度"],"A","增大被连接件刚度，可降低外载荷分配给螺栓的比例，从而减小螺栓应力幅。","螺纹连接"],
// V带传动（第1—29题）
["V带传动和平型带传动相比，V带传动的主要优点是（ ）。",["A. 在传递相同功率条件下，传动尺寸小","B. 传动效率高","C. 带的寿命长","D. 带的价格便宜"],"A","V带具有楔紧作用，在相同功率下可用较小的带轮和较紧凑的结构传递动力。","带传动"],
["在一般传递动力的机械中，主要采用（ ）传动。",["A. 平带","B. 同步带","C. V带","D. 多楔带"],"C","一般机械动力传递中，V带应用最广。","带传动"],
["V带传动中，带截面楔角为40°，带轮的轮槽角应（ ）40°。",["A. 大于","B. 等于","C. 小于","D. 以上三种均可以"],"C","轮槽角通常小于V带楔角，以形成楔紧作用；具体轮槽角按带轮基准直径等条件选取。","带传动"],
["V带横截面中的两工作面之间的夹角为40°，则带轮轮槽应是（ ）。",["A. 40°","B. 38°","C. 按带轮基准直径选取","D. 按V带型号选取"],"C","轮槽角不是固定的38°，应根据带轮基准直径等标准条件选取。定性上轮槽角小于V带楔角40°。","带传动"],
["带传动是依靠（ ）来传递动力的。",["A. 带与带轮接触面之间的正压力","B. 带与带轮接触面之间的摩擦力","C. 带的紧边拉力","D. 带的松边拉力"],"B","普通带传动靠带与带轮接触面之间的摩擦力传递动力。V带的楔紧作用会提高这种摩擦传力能力。","带传动"],
["带传动中，主动轮圆周速度v₁、从动轮圆周速度v₂、带速v，它们之间的关系是（ ）。",["A. v₁=v₂=v","B. v₁>v>v₂","C. v₁<v<v₂","D. v>v₁>v₂"],"B","考虑弹性滑动，主动轮圆周速度大于带速，带速又大于从动轮圆周速度，因此v₁>v>v₂。","带传动"],
["（减速）带传动中，若小带轮为主动轮，则带的最大应力发生在带（ ）处。",["A. 进入主动轮","B. 进入从动轮","C. 退出主动轮","D. 退出从动轮"],"A","小带轮为主动轮时，紧边进入主动轮的位置对应最大拉应力，并叠加弯曲应力，是最大应力位置。","带传动"],
["带传动正常工作时，紧边拉力F₁和松边拉力F₂可由式（ ）表示。",["A. F₁=F₂","B. F₁−F₂=Fₑ","C. F₁/F₂=e^{fα}","D. F₁+F₂=0"],"B","有效圆周力Fₑ就是紧边与松边拉力之差：Fₑ=F₁−F₂。","带传动"],
["即将打滑时，传动带所能传递的最大有效拉力Fmax和初拉力F₀之间的关系为（ ）。",["A. Fmax=2F₀e^{fα}/(e^{fα}−1)","B. Fmax=2F₀(e^{fα}+1)/(e^{fα}−1)","C. Fmax=2F₀(e^{fα}−1)/(e^{fα}+1)","D. Fmax=2F₀(e^{fα}−1)/(e^{fα}−1)"],"C","临界打滑时F₁/F₂=e^{fα}，且F₁+F₂=2F₀；再由Fmax=F₁−F₂联立可得C。","带传动"],
["柔性摩擦的欧拉公式F₁=F₂e^{fα}是在忽略离心力的情况下推导出来的，如果考虑离心力的影响，则公式应变为（ ）。",["A. (F₁+qv²)/(F₂+qv²)=e^{fα}","B. (F₁−qv²)/(F₂−qv²)=e^{fα}","C. (F₁−qv²)/(F₂+qv²)=e^{fα}","D. (F₁+qv²)/(F₂−qv²)=e^{fα}"],"B","考虑离心力后，带的有效拉力应扣除离心拉力qv²，因此为(F₁−qv²)/(F₂−qv²)=e^{fα}。","带传动"],
["带传动工作时，带的横截面上产生的应力，其中（ ）对带的疲劳强度影响最大。",["A. 拉力引起的拉应力","B. 离心力引起的离心应力","C. 绕在大轮上引起的弯曲应力","D. 绕在小轮上引起的弯曲应力"],"D","带绕小带轮时曲率变化更大、弯曲应力更大，因此小带轮处的弯曲应力对带的疲劳强度影响最大。","带传动"],
["带传动打滑的主要原因是（ ）。",["A. 过载","B. 带的弹性变形","C. 紧、松边拉力差","D. 带的弯曲应力过大"],"A","传递功率超过带传动的极限能力时，有效拉力过大，带与带轮间发生相对滑动，即打滑。","带传动"],
["带传动正常工作时不能保证准确的传动比是因为（ ）。",["A. 带的材料不符合规定","B. 带容易变形和磨损","C. 带在带轮上打滑","D. 带的弹性滑动"],"D","正常工作时即使没有打滑，带仍会因紧、松边拉力不同而产生弹性滑动，因此传动比不能保持绝对准确。","带传动"],
["带传动在工作中产生弹性滑动的原因是（ ）。",["A. 预紧力不足","B. 离心力大","C. 带的弹性与紧边松边存在拉力差","D. 传递的功率超过了临界值"],"C","紧边和松边的拉力不同，使带产生不同程度的弹性变形，进入、离开带轮时产生相对滑动，这就是弹性滑动。","带传动"],
["在设计V带传动中，小带轮包角α₁应不小于120°，主要为了（ ）。",["A. 减小弹性滑动","B. 减小离心拉应力","C. 减小弯曲应力","D. 增加摩擦力"],"D","包角越大，带与小带轮的接触弧越长，可参与传力的接触面积越大，从而提高摩擦传力能力。","带传动"],
["带传动的中心距与小带轮的直径一定时，若增大传动比，则小带轮上的包角（ ）。",["A. 减小","B. 增大","C. 不变"],"A","传动比增大意味着大带轮直径相对增大；在中心距和小带轮直径一定时，小带轮包角随两轮直径差增大而减小。","带传动"],
["两带轮直径一定时，减小中心距将引起（ ）。",["A. 带的弹性滑动加剧","B. 带传动效率降低","C. 带工作噪声增大","D. 小带轮上的包角减小而易产生打滑"],"D","中心距减小会使小带轮包角减小，接触弧缩短，摩擦传力能力下降，容易发生打滑。","带传动"],
["带传动的中心距过大时，会导致（ ）。",["A. 带的寿命缩短","B. 带的弹性滑动加剧","C. 带在工作时会产生振动","D. 小带轮包角减小而易产生打滑"],"C","中心距过大时，带的长度较长、运行稳定性变差，容易产生振动。","带传动"],
["若传动的几何参数保持不变，仅把带速提高到原来的2倍，则V带所能传递的功率将（ ）。",["A. 低于原来的2倍","B. 等于原来的2倍","C. 大于原来的2倍"],"A","带速提高后，离心力和弯曲等影响增大，允许有效拉力不能按简单比例同步增加，因此可传递功率低于原来的2倍。","带传动"],

let mode='all', chapter='all', i=0,score=0,answered=false,selected='',round=[],mockRound=[],wrong=JSON.parse(localStorage.getItem('jx_wrong')||'[]'),fav=JSON.parse(localStorage.getItem('jx_fav')||'[]'),weak=JSON.parse(localStorage.getItem('jx_weak')||'[]');
const app=document.getElementById('app');
function chapters(){return [...new Set(qs.map(q=>q[4]))]}

 const a=filtered();

 <div class="actions"><button class="mainbtn" onclick="next()" ${answered?'':'disabled'}>${i===round.length-1?'完成本轮':'下一题'}</button><button class="fav" onclick="toggleFav()">${fav.includes(n)?'★':'☆'}</button></div></div><div class="tip">母题答完后可自由选择“下一题”继续刷题，也可以点击“举一反三”进行同考点变式训练；变式做不好会进入“似会非会”。</div>`;
}
function choose(v){if(answered)return;selected=v;answered=true;const n=round[i].n;if(qs[n][2]!=='?'&&v===qs[n][2]){score++;wrong=wrong.filter(x=>x!==n)}else if(qs[n][2]!=='?'&&!wrong.includes(n))wrong.push(n);localStorage.setItem('jx_wrong',JSON.stringify(wrong));render()}
function next(){if(!answered)return;i++;selected='';answered=false;render()}
function toggleFav(){const n=round[i].n;if(fav.includes(n))fav=fav.filter(x=>x!==n);else fav.push(n);localStorage.setItem('jx_fav',JSON.stringify(fav));render()}
function setMode(m){mode=m;start()}
function setChapter(c){chapter=c;start()}

function openVariants(){
 const n=round[i]?.n;
 const vs=variants[n]||[];
 if(!vs.length){alert('这道母题暂时还没有录入变式。以后新增题目时可以继续给它挂变式。');return;}
 let vi=0,vscore=0,vans=false,vsel='';
 function finishVariants(){
   // 变式刷完后只静默更新“似会非会”状态，不再弹出“掌握情况”页面。
   const weakNow=vscore<Math.ceil(vs.length*0.67);
   if(weakNow){if(!weak.includes(n))weak.push(n)}else{weak=weak.filter(x=>x!==n)}
   localStorage.setItem('jx_weak',JSON.stringify(weak));
   delete window.__vchoose;
   delete window.__vnext;
   // 完成最后一道变式后，自动回到当前母题。
   render();
 }
 function vrender(){
  const v=vs[vi];
  app.innerHTML=`<div class="title">举一反三</div><div class="sub">母题：${n+1}｜本组 ${vi+1}/${vs.length}｜同一考点换角度</div>
  <div class="stats"><div class="stat"><b>${vscore}</b>本组答对</div><div class="stat"><b>${vs.length}</b>变式总数</div><div class="stat"><b>${n+1}</b>母题题号</div><div class="stat"><b>迁移训练</b>模式</div></div>
  <div class="card"><span class="tag">${qs[n][4]} · 变式${vi+1}</span><div class="q">${v[0]}</div>${v[1].map(x=>`<button class="opt ${vans?(x[0]===v[2]?'ok':(x[0]===vsel?'no':'')):(x[0]===vsel?'sel':'')}" onclick="window.__vchoose('${x[0]}')" ${vans?'disabled':''}>${x}</button>`).join('')}
  ${vans?`<div class="answer"><b>答案：${v[2]}</b><div class="reason">解析：${v[3]}</div>${vsel!==v[2]?'<div class="mistake">这道变式答错了——重点不是记住答案，而是找出与母题相同的知识本质。</div>':''}</div>`:''}
  <div class="actions"><button class="mainbtn" onclick="window.__vnext()" ${vans?'':'disabled'}>${vi===vs.length-1?'下一题':'下一道变式'}</button></div></div>
  <div class="tip">变式会改变问法、选项或应用场景，专门检查你是否真正理解这个知识点。</div>`;
 }
 window.__vchoose=function(x){if(vans)return;vsel=x;vans=true;if(x===vs[vi][2])vscore++;vrender()};
 window.__vnext=function(){if(!vans)return;if(vi===vs.length-1){delete window.__vchoose;delete window.__vnext;finishVariants()}else{vi++;vans=false;vsel='';vrender()}};
 vrender();
}
function qLabel(n){return '第'+(n+1)+'题'}

function resetAll(){mode='all';chapter='all';start()}
function clearWeak(){weak=[];localStorage.setItem('jx_weak','[]');render()}
start();

</script></body></html>
